<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>每日健身计划 · 离线版</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --muted:#6b7a8d;
    --line:#e4e9f0; --primary:#ff6a2b; --primary-soft:#fff1e9;
    --accent:#12b8a6; --accent-soft:#e6faf7; --warn:#f0a020; --warn-soft:#fff7e6;
    --danger:#e05252; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6; padding-bottom:150px;
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 14px}
  header.top{
    background:linear-gradient(135deg,#ff7a3d,#ff5a1f); color:#fff;
    padding:18px 0 14px; position:sticky; top:0; z-index:20;
    box-shadow:0 4px 18px rgba(255,106,43,.25);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px; letter-spacing:.3px}
  .brand svg{width:22px; height:22px}
  nav.tabs{display:flex; gap:6px; margin-top:14px}
  nav.tabs button{
    flex:1; border:0; background:rgba(255,255,255,.18); color:#fff;
    padding:9px 4px; border-radius:11px; font-size:14px; font-weight:600;
    cursor:pointer; transition:.18s; font-family:inherit;
  }
  nav.tabs button.active{background:#fff; color:var(--primary)}
  main{padding-top:14px}
  .card{
    background:var(--card); border-radius:var(--radius); padding:15px 16px;
    margin-bottom:12px; box-shadow:0 1px 3px rgba(23,43,77,.06);
    border:1px solid var(--line);
  }
  .hero{background:#fff; border-left:5px solid var(--primary)}
  .hero .d1{color:var(--muted); font-size:13px}
  .hero .d2{font-size:22px; font-weight:750; margin:2px 0 4px}
  .hero .d3{color:var(--muted); font-size:13.5px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
  .chip{
    background:var(--primary-soft); color:#c2491a; font-size:12px;
    padding:3px 9px; border-radius:999px; font-weight:600;
  }
  .chip.g{background:var(--accent-soft); color:#0a8d80}
  .chip.y{background:var(--warn-soft); color:#a86a06}
  .chip.n{background:#eef1f6; color:#5a6a7d}
  h2.sec{font-size:14px; color:var(--muted); font-weight:700; margin:18px 4px 9px; letter-spacing:.4px}
  .banner{border-radius:13px; padding:11px 13px; font-size:13.5px; margin-bottom:12px; font-weight:600}
  .banner.ok{background:var(--accent-soft); color:#087f73; border:1px solid #c6f0ea}
  .banner.warn{background:var(--warn-soft); color:#9a6204; border:1px solid #ffe4ad}
  .banner.info{background:#eef4ff; color:#2b5fae; border:1px solid #d6e4ff}
  .ex{border:1px solid var(--line); border-radius:13px; padding:12px 13px; margin-bottom:10px; background:#fff}
  .ex .row1{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .ex .nm{font-weight:700; font-size:15.5px}
  .ex .mx{font-size:12px; color:var(--muted); background:#f1f4f9; padding:2px 8px; border-radius:999px; white-space:nowrap}
  .ex .spec{display:flex; flex-wrap:wrap; gap:7px; margin:9px 0 7px}
  .spec span{font-size:13px; font-weight:650; background:#f6f8fb; border:1px solid var(--line); padding:2px 9px; border-radius:8px}
  .spec span.load{background:var(--primary-soft); border-color:#ffd9c6; color:#c2491a}
  .ex .cues{font-size:13px; color:#4b5a6d}
  .ex .note{font-size:12.5px; color:#a86a06; background:var(--warn-soft); border-radius:9px; padding:7px 10px; margin-top:8px}
  .ex .foot{display:flex; gap:8px; margin-top:10px}
  .btn{
    border:0; border-radius:11px; padding:9px 14px; font-size:14px; font-weight:650;
    font-family:inherit; cursor:pointer; transition:.15s;
  }
  .btn.primary{background:var(--primary); color:#fff}
  .btn.accent{background:var(--accent); color:#fff}
  .btn.ghost{background:#eef1f6; color:#4b5a6d}
  .btn.danger{background:#fdecec; color:var(--danger)}
  .btn.block{width:100%; padding:13px; font-size:15px}
  .btn:active{transform:scale(.98)}
  .actions{display:flex; gap:9px; margin:16px 0 6px}
  .actions .btn{flex:1}
  .day{display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:12px; background:#fff; border:1px solid var(--line); margin-bottom:8px}
  .day.today{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft)}
  .day .wd{width:52px; text-align:center; flex:none}
  .day .wd b{display:block; font-size:14px}
  .day .wd i{font-style:normal; font-size:11px; color:var(--muted)}
  .day .info{flex:1; min-width:0}
  .day .info b{font-size:14.5px}
  .day .info p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .day .tag{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; flex:none}
  .tag.tr{background:var(--primary-soft); color:#c2491a}
  .tag.rs{background:#eef1f6; color:#5a6a7d}
  .tag.ok{background:var(--accent-soft); color:#087f73}
  .tag.ms{background:#fdecec; color:var(--danger)}
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .cell{border-radius:10px; padding:8px 2px; text-align:center; border:1px solid var(--line); background:#fff}
  .cell .cd{font-size:10.5px; color:var(--muted)}
  .cell .cn{font-size:15px; font-weight:700; margin:1px 0}
  .cell .cm{font-size:10px; font-weight:700; border-radius:6px; padding:1px 0}
  .cell.tr .cm{background:var(--primary-soft); color:#c2491a}
  .cell.rs .cm{background:#eef1f6; color:#7b8798}
  .cell.done{background:var(--accent-soft); border-color:#bdeee7}
  .cell.done .cm{background:#cdf3ee; color:#087f73}
  .cell.miss{background:#fdf1f1; border-color:#f7dcdc}
  .cell.miss .cm{background:#fbe2e2; color:var(--danger)}
  .cell.today{outline:2px solid var(--primary); outline-offset:-2px}
  .bars{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:6px}
  .bar{border-radius:10px; padding:9px 5px; text-align:center; border:1px solid var(--line); background:#fff}
  .bar b{display:block; font-size:13px; margin-bottom:5px}
  .bar .stick{height:44px; border-radius:6px; background:#eef1f6; display:flex; align-items:flex-end; overflow:hidden}
  .bar .stick i{display:block; width:100%; background:linear-gradient(180deg,#ff9a63,#ff6a2b); border-radius:6px}
  .bar.now{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft)}
  .bar.deload .stick i{background:linear-gradient(180deg,#7ad8cd,#12b8a6)}
  .bar small{font-size:11px; color:var(--muted); display:block; margin-top:5px}
  .f{display:block; margin-bottom:12px}
  .f > span{display:block; font-size:13px; font-weight:650; color:#415062; margin-bottom:5px}
  .f input,.f select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:11px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .f input:focus,.f select:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
  .preset-row{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 9px}
  .preset{
    border:1px solid var(--line); background:#f6f8fb; color:#5a6a7d; border-radius:999px;
    padding:5px 12px; font-size:12.5px; font-weight:650; font-family:inherit; cursor:pointer; transition:.15s;
  }
  .preset[aria-pressed="true"]{background:var(--primary-soft); border-color:#ffd9c6; color:#c2491a}
  .wd-picker{display:flex; gap:6px}
  .wd-btn{
    flex:1; min-width:0; border:1px solid var(--line); background:#fff; color:#415062;
    border-radius:11px; padding:11px 0; font-size:15px; font-weight:650; font-family:inherit; cursor:pointer; transition:.15s;
  }
  .wd-btn[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:#fff}
  .preset:active,.wd-btn:active{transform:scale(.97)}
  .wd-hint{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:18px}
  .wd-hint.warn{color:#a86a06}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .kv{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--muted)}
  .kv b{font-weight:700}
  #timerBar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:#1b2430; color:#fff; padding:12px 16px 16px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 -6px 24px rgba(23,43,77,.22);
  }
  #timerBar.hide{display:none}
  #timerBar .lab{font-size:12px; opacity:.7}
  #timerBar .disp{font-size:30px; font-weight:750; font-variant-numeric:tabular-nums; line-height:1}
  #timerBar .sp{flex:1}
  #timerBar button{
    border:0; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:650;
    background:#2f3d4f; color:#fff; font-family:inherit; cursor:pointer;
  }
  #timerBar button.main{background:var(--primary)}
  footer{color:var(--muted); font-size:12px; text-align:center; padding:22px 18px 34px; line-height:1.7}
  .empty{text-align:center; padding:34px 18px}
  .empty h3{margin:0 0 8px; font-size:18px}
  .empty p{color:var(--muted); font-size:14px; margin:0 0 18px}
  @media (max-width:380px){
    .hero .d2{font-size:19px}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      <span>每日健身计划</span>
    </div>
    <nav class="tabs">
      <button data-tab="today" class="active">今日</button>
      <button data-tab="plan">计划</button>
      <button data-tab="me">我的</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="view-today"></section>
  <section id="view-plan" hidden></section>
  <section id="view-me" hidden></section>
</main>

<div id="timerBar" class="hide">
  <div>
    <div class="lab" id="timerLabel">组间休息</div>
    <div class="disp" id="timerDisplay">00:45</div>
  </div>
  <div class="sp"></div>
  <button class="main" id="timerToggle">暂停</button>
  <button id="timerReset">重置</button>
</div>

<footer>
  本工具提供的训练建议基于通用健身原则，不构成医疗建议。<br>
  如有伤病、心血管疾病、孕期或慢性疾病，请先咨询医生或专业教练。
</footer>

<script id="plan-engine">
/* =========================================================================
   计划引擎 —— 纯函数实现，不依赖 DOM / localStorage，可被 Node 测试脚本直接加载。
   ========================================================================= */
(function () {
  'use strict';

  var BW = ['home_bodyweight', 'home_dumbbell', 'gym'];
  var DBV = ['home_dumbbell', 'gym'];

  var GOALS = {
    fat_loss:    { label: '减脂', reps: '12-15', rest: 45 },
    muscle_gain: { label: '增肌', reps: '8-12',  rest: 75 },
    recomp:      { label: '塑形', reps: '10-12', rest: 60 },
    strength:    { label: '增力', primary: { reps: '4-6', rest: 120 }, accessory: { reps: '8-10', rest: 90 } }
  };

  var EXPERIENCE = {
    beginner:     { label: '新手', tierCap: 1, loadScale: 0.85, sets: [2, 3, 3, 2] },
    intermediate: { label: '中级', tierCap: 2, loadScale: 1.00, sets: [3, 3, 4, 2] },
    advanced:     { label: '进阶', tierCap: 3, loadScale: 1.15, sets: [4, 4, 5, 3] }
  };

  var VENUES = {
    home_bodyweight: '居家徒手',
    home_dumbbell:   '居家哑铃',
    gym:             '健身房'
  };

  /* 推荐预设：仅用于「推荐排布」快捷按钮与旧数据迁移；实际排期以 profile.trainingWeekdays 为准 */
  var WEEKDAY_PRESETS = {
    1: [2],
    2: [0, 3],
    3: [0, 2, 4],
    4: [0, 1, 3, 4],
    5: [0, 1, 2, 4, 5],
    6: [0, 1, 2, 3, 4, 5],
    7: [0, 1, 2, 3, 4, 5, 6]
  };

  var WEEKDAY_CN = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var WEEKDAY_SHORT = ['一', '二', '三', '四', '五', '六', '日'];

  var DB_SIZES = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 16, 18, 20, 22.5, 25, 27.5, 30, 32.5, 35];

  var PATTERN_LABEL = {
    squat: '深蹲类', hinge: '髋铰链类', lunge: '弓步类',
    horizontal_push: '水平推', vertical_push: '垂直推',
    horizontal_pull: '水平拉', vertical_pull: '垂直拉',
    glute: '臀部孤立', core: '核心', calf: '小腿',
    biceps: '肱二头肌', triceps: '肱三头肌', lateral_raise: '肩部孤立',
    cardio: '有氧收尾'
  };

  var ISOLATION = { biceps: 1, triceps: 1, lateral_raise: 1, calf: 1, glute: 1, core: 1 };

  var PATTERN_FALLBACK = {
    vertical_pull: 'horizontal_pull',
    lateral_raise: 'vertical_push',
    biceps: 'horizontal_pull',
    triceps: 'horizontal_push'
  };

  function E(id, pattern, name, muscle, tier, venues, o) {
    var base = {
      id: id, pattern: pattern, name: name, muscle: muscle, tier: tier, venues: venues,
      /* 器材等级：三场地可用 = 徒手；哑铃/健身房两场地 = 哑铃；仅健身房 = 器械 */
      equip: venues.length === 3 ? 'bw' : (venues.length === 2 ? 'db' : 'gym'),
      weighted: false, ratio: 0, isJump: false, isTime: false, timeReps: '', perHand: false,
      loadType: null, minLoad: 0, cues: '', note: ''
    };
    if (o) { for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) base[k] = o[k]; } }
    return base;
  }

  var EXERCISES = [
    /* ---------------- 深蹲类 ---------------- */
    E('sq-bw', 'squat', '自重深蹲', '股四头肌 · 臀大肌', 1, BW, {
      cues: '双脚与肩同宽、脚尖略外展，屈髋屈膝下蹲至大腿接近平行，膝盖与脚尖同向，脚跟发力起身。' }),
    E('sq-box', 'squat', '箱式深蹲', '股四头肌 · 臀大肌', 1, BW, {
      cues: '身后放椅子或箱子，臀部向后坐至轻触箱面，保持小腿接近垂直再站起；控制不好深蹲深度的人优先用它。' }),
    E('sq-wall', 'squat', '靠墙静蹲', '股四头肌', 1, BW, {
      isTime: true, timeReps: '45 秒',
      cues: '背贴墙、双脚前移一步，屈膝下蹲至大腿与地面约 45–60 度，膝盖不超过脚尖，均匀呼吸。' }),
    E('sq-single', 'squat', '单腿箱式深蹲', '股四头肌 · 臀大肌', 3, BW, {
      cues: '单脚站立、另一腿前伸，臀部向后坐至箱面再单腿站起，全程保持膝盖稳定不内扣。' }),
    E('sq-goblet', 'squat', '哑铃高脚杯深蹲', '股四头肌 · 臀大肌', 1, DBV, {
      weighted: true, ratio: 0.20, loadType: 'dumbbell',
      cues: '双手捧一只哑铃于胸前，挺胸下蹲至大腿平行，肘部落在两腿内侧，起身时呼气。' }),
    E('sq-sumo', 'squat', '哑铃相扑深蹲', '臀大肌 · 内收肌', 2, DBV, {
      weighted: true, ratio: 0.22, loadType: 'dumbbell',
      cues: '双脚比肩宽、脚尖外展约 30 度，双手持哑铃置于两腿之间，垂直下蹲，起身时臀部收紧。' }),
    E('sq-bulgarian', 'squat', '哑铃保加利亚分腿蹲', '股四头肌 · 臀大肌', 3, DBV, {
      weighted: true, ratio: 0.12, perHand: true, loadType: 'dumbbell',
      cues: '后脚搭在椅面上、前脚向前一步，重心垂直下沉至前腿大腿接近平行，膝盖对准脚尖。' }),
    E('sq-legpress', 'squat', '腿举', '股四头肌 · 臀大肌', 1, ['gym'], {
      weighted: true, ratio: 0.90, loadType: 'machine', minLoad: 10,
      cues: '调整座椅使膝盖弯曲约 90 度，双脚与肩同宽踩实，推到膝盖接近伸直但不锁死，缓慢回落。' }),
    E('sq-backsquat', 'squat', '杠铃后蹲', '股四头肌 · 臀大肌 · 核心', 2, ['gym'], {
      weighted: true, ratio: 0.45, loadType: 'barbell', minLoad: 20,
      cues: '杠铃置于斜方肌上，挺胸收腹，屈髋屈膝下蹲至大腿平行，躯干保持直立，脚跟发力起身。' }),

    /* ---------------- 髋铰链类 ---------------- */
    E('hg-bridge', 'hinge', '臀桥', '臀大肌 · 腘绳肌', 1, BW, {
      cues: '仰卧屈膝、脚跟距臀部约一掌，收紧臀部把髋顶起至肩-髋-膝成直线，顶点停 1 秒。' }),
    E('hg-single-bridge', 'hinge', '单腿臀桥', '臀大肌 · 腘绳肌', 2, BW, {
      cues: '一腿屈膝踩地、另一腿伸直抬起，单侧顶髋至躯干成直线，避免腰部代偿。' }),
    E('hg-goodmorning', 'hinge', '徒手早安式体前屈', '腘绳肌 · 臀大肌 · 下背', 1, BW, {
      cues: '双手抱头或交叉胸前，微屈膝，髋部向后推使躯干前倾至接近水平，背部保持中立再起身。' }),
    E('hg-rdl-db', 'hinge', '哑铃罗马尼亚硬拉', '腘绳肌 · 臀大肌', 2, DBV, {
      weighted: true, ratio: 0.25, perHand: true, loadType: 'dumbbell',
      cues: '双手持哑铃垂于体前，微屈膝，髋向后推、躯干前倾，哑铃贴着腿下滑至小腿中段，臀腿发力站起。' }),
    E('hg-single-rdl', 'hinge', '哑铃单腿硬拉', '腘绳肌 · 臀大肌 · 平衡', 2, DBV, {
      weighted: true, ratio: 0.18, perHand: true, loadType: 'dumbbell',
      cues: '单脚支撑、另一腿向后延伸，髋部后推使躯干前倾，支撑侧臀腿发力回到直立。' }),
    E('hg-deadlift', 'hinge', '杠铃硬拉', '臀大肌 · 腘绳肌 · 背部', 3, ['gym'], {
      weighted: true, ratio: 0.60, loadType: 'barbell', minLoad: 20,
      cues: '杠铃贴近小腿，屈髋屈膝握杠，挺胸收腹，脚蹬地的同时伸髋伸膝站起，全程背部中立。' }),
    E('hg-rdl-bar', 'hinge', '杠铃罗马尼亚硬拉', '腘绳肌 · 臀大肌', 2, ['gym'], {
      weighted: true, ratio: 0.45, loadType: 'barbell', minLoad: 20,
      cues: '站直握杠、微屈膝，髋向后推使杠铃贴腿下降至膝下，感受腘绳肌拉伸后顶髋站起。' }),
    E('hg-legcurl', 'hinge', '器械俯卧腿弯举', '腘绳肌', 1, ['gym'], {
      weighted: true, ratio: 0.30, loadType: 'machine', minLoad: 5,

  /* ------------------------------------------------------------------ 日期工具 */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fromISO(iso) {
    var p = String(iso).split('-');

  /* ------------------------------------------------------------------ 动作挑选 */

  /* ------------------------------------------------------------------ 单次训练 */

        restSec: 0, loadText: '自重', loadRaw: 0, loadWeight: 0, loadUnit: null,

  }

  /**
   * 生成 [fromISO .. endISO] 每一天的排期（fromISO 省略时只输出今天及以后）。
   * 规则：训练日序数只在「该日打卡完成」或「该日尚未到来」时前进；
   *       过去的未完成训练日不推进序号 —— 这就是漏练自动顺延。
   */
  function buildTimeline(profileRaw, progressRaw, todayISO, endISO, fromISO) {
    var p = normalizeProfile(profileRaw);
    var progress = progressRaw || {};
    var logs = progress.logs || {};
    var out = {};
    var end = endISO && diffDays(todayISO, endISO) > 0 ? endISO : todayISO;
    var from = fromISO && diffDays(fromISO, todayISO) > 0 ? fromISO : todayISO;
    if (diffDays(p.startDate, end) < 0) return out;

    var idx = 1;
    var cursor = p.startDate;
    var guard = 0;
    while (diffDays(cursor, end) >= 0 && guard++ < 7300) {
      var training = p.trainingWeekdays.indexOf(weekdayMon0(cursor)) >= 0;
      var log = logs[cursor] || null;
      var isPast = diffDays(cursor, todayISO) > 0;
      var isToday = !isPast && diffDays(todayISO, cursor) === 0;
      var done = !!(log && (log.status === 'done'));
      var restDone = !!(log && log.status === 'rest_done');
      var missed = !!(log && log.status === 'missed');

      if (diffDays(from, cursor) >= 0) {
        out[cursor] = {
          date: cursor,
          weekday: weekdayName(cursor),
          training: training,
          sessionIndex: idx,
          completed: training ? done : restDone,
          missed: missed,
          isPast: isPast,
          isToday: isToday,
          skipped: missed
        };
      }

      if (training && (!isPast || done)) idx++;
      cursor = addDays(cursor, 1);
    }
    return out;
  }

  function computeStreak(logs, todayISO) {
    var ok = function (iso) {
      var l = logs[iso];
      return !!(l && (l.status === 'done' || l.status === 'rest_done'));
    };
    var cursor = ok(todayISO) ? todayISO : addDays(todayISO, -1);
    var n = 0;
    while (ok(cursor) && n < 3650) { n++; cursor = addDays(cursor, -1); }
    return n;
  }

  function completedTrainingDays(progress) {
    var logs = (progress && progress.logs) || {};
    var n = 0;
    for (var k in logs) {
      if (Object.prototype.hasOwnProperty.call(logs, k) && logs[k] && logs[k].status === 'done') n++;
    }
    return n;
  }

  function weekRangeOf(todayISO) {
    var back = weekdayMon0(todayISO);
    var monday = addDays(todayISO, -back);
    var out = [];
    for (var i = 0; i < 7; i++) out.push(addDays(monday, i));
    return out;
  }

  var PlanEngine = {
    VERSION: 'v1',
    GOALS: GOALS, EXPERIENCE: EXPERIENCE, VENUES: VENUES,
    WEEKDAY_PRESETS: WEEKDAY_PRESETS, WEEKDAY_CN: WEEKDAY_CN, WEEKDAY_SHORT: WEEKDAY_SHORT,
    DB_SIZES: DB_SIZES, EXERCISES: EXERCISES, PATTERN_FALLBACK: PATTERN_FALLBACK,
    pad2: pad2, toISO: toISO, fromISO: fromISO, addDays: addDays, diffDays: diffDays,
    weekdayMon0: weekdayMon0, weekdayName: weekdayName, formatCN: formatCN,
    normalizeWeekdays: normalizeWeekdays, presetWeekdays: presetWeekdays, weekdaySummary: weekdaySummary,
    bmi: bmi, bodyClassFromBmi: bodyClassFromBmi, bodyClassLabel: bodyClassLabel,
    healthyWeightRange: healthyWeightRange, heightClass: heightClass, heightClassLabel: heightClassLabel,
    normalizeProfile: normalizeProfile, validateProfile: validateProfile,
    splitFor: splitFor, pickExercise: pickExercise,
    roundToStep: roundToStep, nearestFrom: nearestFrom, prescribeLoad: prescribeLoad, bumpReps: bumpReps,
    sessionFor: sessionFor, isTrainingDate: isTrainingDate, trainingWeekdays: trainingWeekdays,
    buildTimeline: buildTimeline, computeStreak: computeStreak,
    completedTrainingDays: completedTrainingDays, weekRangeOf: weekRangeOf
  };

  if (typeof globalThis !== 'undefined') globalThis.PlanEngine = PlanEngine;
})();
</script>

<script id="app-ui">
/* =========================================================================
   界面层
   ========================================================================= */
(function () {
  'use strict';
  var E = globalThis.PlanEngine;
  var KEY_PROFILE = 'fitnessPlan.v1.profile';
  var KEY_PROGRESS = 'fitnessPlan.v1.progress';

  var state = { profile: null, progress: null, tab: 'today', timer: null };

  /* ---------------- 存储 ---------------- */
  function safeGet(key) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function loadState() {
    /* 历史档案可能只有 daysPerWeek，读出时立即规范化，保证 trainingWeekdays 一定存在 */
    var rawProfile = safeGet(KEY_PROFILE);
    state.profile = rawProfile ? E.normalizeProfile(rawProfile) : null;
    state.progress = safeGet(KEY_PROGRESS) || { logs: {} };
    if (!state.progress.logs) state.progress.logs = {};
  }
  function saveProfile() { safeSet(KEY_PROFILE, state.profile); }
  function saveProgress() { safeSet(KEY_PROGRESS, state.progress); }

  function todayISO() { return E.toISO(new Date()); }
  function esc(s) { return String(s == null ? '' : s); }

  /* ---------------- 计时器 ---------------- */
  var timerRemain = 0, timerHandle = null, timerRunning = false;

  function fmtSec(s) {
    var m = Math.floor(s / 60), x = s % 60;
    return E.pad2(m) + ':' + E.pad2(x);
  }
  function beep() {
    try {
      var Ctx = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      [0, 0.22, 0.44].forEach(function (delay) {
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.001;
        osc.connect(gain); gain.connect(ctx.destination);
        var t0 = ctx.currentTime + delay;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        osc.start(t0); osc.stop(t0 + 0.22);
      });
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1200);
    } catch (e) {}
  }
  function showTimer(sec, label) {
    timerRemain = sec;
    timerRunning = true;
    document.getElementById('timerLabel').textContent = label || '组间休息';
    document.getElementById('timerDisplay').textContent = fmtSec(timerRemain);
    document.getElementById('timerToggle').textContent = '暂停';
    document.getElementById('timerBar').classList.remove('hide');
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tick, 1000);
  }
  function tick() {
    if (!timerRunning) return;
    timerRemain--;
    if (timerRemain <= 0) {
      timerRemain = 0;
      timerRunning = false;
      clearInterval(timerHandle); timerHandle = null;
      document.getElementById('timerDisplay').textContent = fmtSec(0);
      document.getElementById('timerToggle').textContent = '重新开始';
      document.getElementById('timerLabel').textContent = '完成！开始下一组';
      beep();
      return;
    }
    document.getElementById('timerDisplay').textContent = fmtSec(timerRemain);
  }
  function toggleTimer() {
    if (!timerHandle && timerRemain === 0) {
      document.getElementById('timerBar').classList.add('hide');
      return;
    }
    timerRunning = !timerRunning;
    document.getElementById('timerToggle').textContent = timerRunning ? '暂停' : '继续';
  }
  function resetTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null; timerRunning = false; timerRemain = 0;
    document.getElementById('timerBar').classList.add('hide');
  }

  /* ---------------- 打卡 ---------------- */
  function checkIn(dateISO, status, sessionIndex) {
    state.progress.logs[dateISO] = { status: status, sessionIndex: sessionIndex, at: new Date().toISOString() };
    saveProgress();
    render();
  }
  function skipDay(dateISO, sessionIndex) {
    state.progress.logs[dateISO] = { status: 'missed', sessionIndex: sessionIndex, at: new Date().toISOString() };
    saveProgress();
    render();
  }
  function resetAll() {
    state.progress = { logs: {} };
    saveProgress();
    render();
  }

  /* ---------------- 渲染：今日 ---------------- */
  function chipList(p) {
    var b = E.bmi(p.heightCm, p.weightKg);
    var bc = E.bodyClassFromBmi(b);
    return '<div class="chips">' +
      '<span class="chip">' + E.GOALS[p.goal].label + '</span>' +
      '<span class="chip">每周 ' + p.daysPerWeek + ' 天 · ' + E.weekdaySummary(p.trainingWeekdays) + '</span>' +
      '<span class="chip">' + E.EXPERIENCE[p.experience].label + '</span>' +
      '<span class="chip n">' + E.VENUES[p.venue] + '</span>' +
      '<span class="chip ' + (bc === 'normal' ? 'g' : 'y') + '">BMI ' + b.toFixed(1) + ' ' + E.bodyClassLabel(bc) + '</span>' +
      '</div>';
  }

  function exerciseCard(ex) {
    var spec = '<span>' + ex.sets + ' 组</span><span>× ' + ex.reps + '</span>' +
      '<span class="load">' + ex.loadText + (ex.loadUnit && ex.loadUnit !== '自重' && ex.weighted ? '（' + ex.loadUnit + '）' : '') + '</span>' +
      (ex.restSec ? '<span>休息 ' + ex.restSec + ' 秒</span>' : '');
    return '<div class="ex">' +
      '<div class="row1"><div class="nm">' + esc(ex.name) + '</div><div class="mx">' + esc(ex.muscle) + '</div></div>' +
      '<div class="spec">' + spec + '</div>' +
      '<div class="cues">' + esc(ex.cues) + '</div>' +
      ex.notes.map(function (n) { return '<div class="note">' + esc(n) + '</div>'; }).join('') +
      (ex.restSec ? '<div class="foot"><button class="btn ghost" data-rest="' + ex.restSec + '">开始休息 ' + ex.restSec + 's</button></div>' : '') +
      '</div>';
  }

  function renderToday() {
    var el = document.getElementById('view-today');
    if (!state.profile) {
      el.innerHTML = '<div class="card empty"><h3>先设置你的身体数据</h3>' +
        '<p>填写身高、体重、目标与训练条件，App 会为你生成精确到每一天、可以一直练下去的健身计划。</p>' +
        '<button class="btn primary block" data-goto="me">去填写资料</button></div>';
      return;
    }
    var p = state.profile;
    var today = todayISO();
    var tl = E.buildTimeline(p, state.progress, today, today);
    var entry = tl[today];
    var streak = E.computeStreak(state.progress.logs, today);

    if (!entry) {
      el.innerHTML = '<div class="card hero"><div class="d1">计划尚未开始</div>' +
        '<div class="d2">' + E.formatCN(p.startDate) + '</div>' +
        '<div class="d3">计划将从这一天开始，每天都有明确安排。</div></div>' +
        '<div class="card"><div class="kv"><span>起始日期</span><b>' + p.startDate + '</b></div>' +
        '<div class="kv"><span>每周训练</span><b>' + p.daysPerWeek + ' 天</b></div>' +
        '<div class="kv"><span>训练日</span><b>' + p.trainingWeekdays.map(function (d) { return E.WEEKDAY_CN[d]; }).join('、') + '</b></div></div>';
      return;
    }

    var html = '';
    if (entry.training) {
      var s = E.sessionFor(p, entry.sessionIndex);
      html += '<div class="card hero">' +
        '<div class="d1">' + E.formatCN(today) + '</div>' +
        '<div class="d2">第 ' + s.index + ' 天 · 第 ' + s.week + ' 周</div>' +
        '<div class="d3">第 ' + s.block + ' 个中周期 · ' + (s.isDeload ? '减载周' : '强化周') + ' ｜ ' + esc(s.title) + '</div>' +
        chipList(p) + '</div>';

      if (entry.completed) {
        html += '<div class="banner ok">今日训练已完成，连续打卡 ' + streak + ' 天。下一个训练日继续加油。</div>';
      } else if (entry.missed) {
        html += '<div class="banner warn">今天已标记为跳过，训练内容顺延到下一个训练日，计划不会中断。</div>';
      } else {
        html += '<div class="banner info">今天是训练日，当前连续打卡 ' + streak + ' 天。完成全部动作后记得打卡。</div>';
      }
      s.warnings.forEach(function (w) { html += '<div class="banner warn">' + esc(w) + '</div>'; });

      html += '<h2 class="sec">热身 · 约 5 分钟</h2><div class="card"><div class="cues">' + esc(s.warmup) + '</div></div>';
      html += '<h2 class="sec">正式训练 · ' + s.exercises.length + ' 个动作</h2>';
      html += s.exercises.map(exerciseCard).join('');
      if (s.finisher) {
        html += '<h2 class="sec">有氧收尾</h2>' + exerciseCard(s.finisher);
      }
      html += '<h2 class="sec">拉伸放松</h2><div class="card"><div class="cues">' + esc(s.cooldown) + '</div></div>';

      if (!entry.completed && !entry.missed) {
        html += '<div class="actions"><button class="btn accent" id="btnDone">完成今日训练</button>' +
          '<button class="btn ghost" id="btnSkip">今天跳过，顺延</button></div>';
      } else if (entry.missed) {
        html += '<div class="actions"><button class="btn accent" id="btnDone">我练完了，撤销跳过</button></div>';
      } else {
        html += '<div class="actions"><button class="btn ghost" id="btnUndo">撤销今日打卡</button></div>';
      }
    } else {
      var next = E.buildTimeline(p, state.progress, today, E.addDays(today, 7));
      var nextTrain = null;
      for (var i = 1; i <= 7 && !nextTrain; i++) {
        var key = E.addDays(today, i);
        if (next[key] && next[key].training) nextTrain = next[key];
      }
      html += '<div class="card hero">' +
        '<div class="d1">' + E.formatCN(today) + '</div>' +
        '<div class="d2">今天是休息日</div>' +
        '<div class="d3">恢复同样重要，让肌肉在休息中变强。</div>' +
        chipList(p) + '</div>';
      if (entry.completed) html += '<div class="banner ok">今日恢复打卡已完成，连续打卡 ' + streak + ' 天。</div>';
      else html += '<div class="banner info">今天是休息日，当前连续打卡 ' + streak + ' 天。</div>';
      if (nextTrain) {
        var ns = E.sessionFor(p, nextTrain.sessionIndex);
        html += '<div class="card"><div class="kv"><span>下一次训练</span><b>' + E.formatCN(nextTrain.date) + ' 第 ' + ns.index + ' 天</b></div>' +
          '<div class="kv"><span>训练内容</span><b>' + esc(ns.title) + '</b></div>' +
          '<div class="kv"><span>重点</span><b>' + esc(ns.focus) + '</b></div></div>';
      }
      html += '<h2 class="sec">主动恢复建议</h2><div class="card">' +
        '<div class="cues">快走 20–30 分钟（能正常说话的速度）+ 全身拉伸 10 分钟。' +
        '如果昨天练得很累，也可以完全休息、保证睡眠。</div></div>';
      if (!entry.completed) {
        html += '<div class="actions"><button class="btn accent" id="btnRest">完成今日恢复打卡</button></div>';
      } else {
        html += '<div class="actions"><button class="btn ghost" id="btnRestUndo">撤销今日打卡</button></div>';
      }
    }
    el.innerHTML = html;

    var bd = document.getElementById('btnDone');
    if (bd) bd.onclick = function () { checkIn(today, 'done', entry.sessionIndex); };
    var bs = document.getElementById('btnSkip');
    if (bs) bs.onclick = function () { skipDay(today, entry.sessionIndex); };
    var bu = document.getElementById('btnUndo');
    if (bu) bu.onclick = function () { delete state.progress.logs[today]; saveProgress(); render(); };
    var br = document.getElementById('btnRest');
    if (br) br.onclick = function () { checkIn(today, 'rest_done', entry.sessionIndex); };
    var bru = document.getElementById('btnRestUndo');
    if (bru) bru.onclick = function () { delete state.progress.logs[today]; saveProgress(); render(); };
  }

  /* ---------------- 渲染：计划 ---------------- */
  function renderPlan() {
    var el = document.getElementById('view-plan');
    if (!state.profile) {
      el.innerHTML = '<div class="card empty"><h3>还没有计划</h3><p>先在“我的”里填写资料，即可生成连续到每一天的训练安排。</p>' +
        '<button class="btn primary block" data-goto="me">去填写资料</button></div>';
      return;
    }
    var p = state.profile;
    var today = todayISO();
    var horizon = E.addDays(today, 6);
    var tl = E.buildTimeline(p, state.progress, today, horizon);
    var week = E.weekRangeOf(today);
    var weekTl = E.buildTimeline(p, state.progress, today, week[6], week[0]);

    var html = '<h2 class="sec">未来 7 天</h2>';
    for (var i = 0; i < 7; i++) {
      var d = E.addDays(today, i);
      var e = tl[d];
      if (!e) {
        html += '<div class="day"><div class="wd"><b>' + E.weekdayName(d) + '</b><i>' + d.slice(5) + '</i></div>' +
          '<div class="info"><b>计划开始前</b><p>计划将于 ' + p.startDate + ' 开始</p></div><div class="tag rs">未开始</div></div>';
        continue;
      }
      var s = E.sessionFor(p, e.sessionIndex);
      var tag, sub;
      if (e.training) {
        if (e.completed) { tag = '<div class="tag ok">已完成</div>'; }
        else if (e.missed) { tag = '<div class="tag ms">已跳过</div>'; }
        else { tag = '<div class="tag tr">' + (i === 0 ? '今天' : '训练') + '</div>'; }
        sub = '第 ' + s.index + ' 天 · ' + esc(s.title) + ' · ' + s.exercises.length + ' 个动作 · ' + s.exercises.reduce(function (a, x) { return a + x.sets; }, 0) + ' 组';
      } else {
        tag = e.completed ? '<div class="tag ok">已打卡</div>' : '<div class="tag rs">休息</div>';
        sub = '主动恢复：快走 20–30 分钟 + 全身拉伸 10 分钟';
      }
      var wd = E.WEEKDAY_CN[E.weekdayMon0(d)];
      html += '<div class="day' + (i === 0 ? ' today' : '') + '">' +
        '<div class="wd"><b>' + (i === 0 ? '今天' : wd) + '</b><i>' + d.slice(5) + '</i></div>' +
        '<div class="info"><b>' + (i === 0 ? E.formatCN(d) : wd + ' ' + d.slice(5)) + '</b><p>' + sub + '</p></div>' + tag + '</div>';
    }

    html += '<h2 class="sec">本周日历</h2><div class="card"><div class="week">';
    week.forEach(function (d) {
      var e = weekTl[d];
      var cls = 'cell', mark = '—';
      if (e) {
        if (d === today) cls += ' today';
        if (e.missed) { cls += ' miss'; mark = '跳过'; }
        else if (e.completed) { cls += ' done'; mark = '✓'; }
        else if (e.training) { cls += ' tr'; mark = '训练'; }
        else { cls += ' rs'; mark = '休息'; }
      }
      html += '<div class="' + cls + '"><div class="cd">' + E.WEEKDAY_CN[E.weekdayMon0(d)].slice(1) + '</div>' +
        '<div class="cn">' + Number(d.slice(8)) + '</div><div class="cm">' + mark + '</div></div>';
    });
    html += '</div></div>';

    var cur = E.sessionFor(p, (tl[today] ? tl[today].sessionIndex : 1));
    html += '<h2 class="sec">中周期概览（4 周一个周期）</h2><div class="card">' +
      '<div class="kv"><span>当前周期</span><b>第 ' + cur.block + ' 个中周期 · 第 ' + cur.weekInBlock + ' 周</b></div>' +
      '<div class="kv"><span>本周强度系数</span><b>' + cur.progressionFactor.toFixed(2) + '×</b></div>' +
      '<div class="bars">';
    var setsArr = E.EXPERIENCE[p.experience].sets;
    for (var w = 1; w <= 4; w++) {
      var h = Math.round(setsArr[w - 1] / 5 * 44);
      html += '<div class="bar' + (w === cur.weekInBlock ? ' now' : '') + (w === 4 ? ' deload' : '') + '">' +
        '<b>第 ' + w + ' 周</b><div class="stick"><i style="height:' + h + 'px"></i></div>' +
        '<small>' + (w === 4 ? '减载' : setsArr[w - 1] + ' 组') + '</small></div>';
    }
    html += '</div><div class="cues" style="margin-top:11px">第 1–3 周逐步加量，第 4 周主动减载恢复；' +
      '进入第 ' + (cur.block + 1) + ' 个中周期后，负重整体再提高约 3%，可持续长期推进。</div></div>';
    el.innerHTML = html;
  }

  /* ---------------- 渲染：我的 ---------------- */
  function renderMe() {
    var el = document.getElementById('view-me');
    var p = state.profile || E.normalizeProfile({
      heightCm: 170, weightKg: 65, goal: 'recomp', daysPerWeek: 3,
      experience: 'beginner', venue: 'home_bodyweight', startDate: todayISO()
    });
    var b = E.bmi(p.heightCm, p.weightKg);
    var bc = E.bodyClassFromBmi(b);
    var hc = E.heightClass(p.heightCm);
    var range = E.healthyWeightRange(p.heightCm);
    var hasLogs = state.progress && Object.keys(state.progress.logs).length > 0;

    el.innerHTML =
      '<h2 class="sec">身体与目标</h2>' +
      '<div class="card">' +
        '<div class="grid2">' +
          '<label class="f"><span>身高（cm）</span><input id="f-h" type="number" min="100" max="250" step="0.5" value="' + p.heightCm + '"></label>' +
          '<label class="f"><span>体重（kg）</span><input id="f-w" type="number" min="30" max="250" step="0.1" value="' + p.weightKg + '"></label>' +
        '</div>' +
        '<label class="f"><span>训练目标</span><select id="f-goal">' + Object.keys(E.GOALS).map(function (k) {
          return '<option value="' + k + '"' + (p.goal === k ? ' selected' : '') + '>' + E.GOALS[k].label + '</option>';
        }).join('') + '</select></label>' +
        '<div class="f"><span>每周训练日（已选 <b id="wd-count">' + p.trainingWeekdays.length + '</b> 天）</span>' +
          '<div class="preset-row" id="wd-presets">' + [1, 2, 3, 4, 5, 6, 7].map(function (n) {
            return '<button type="button" class="preset" data-preset="' + n + '" title="' +
              E.trainingWeekdays(n).map(function (d) { return E.WEEKDAY_CN[d]; }).join('、') + '">' + n + ' 天</button>';
          }).join('') + '</div>' +
          '<div class="wd-picker" id="wd-picker">' + [0, 1, 2, 3, 4, 5, 6].map(function (i) {
            return '<button type="button" class="wd-btn" data-wd="' + i + '" aria-pressed="' +
              (p.trainingWeekdays.indexOf(i) >= 0) + '" title="' + E.WEEKDAY_CN[i] + '">' + E.WEEKDAY_SHORT[i] + '</button>';
          }).join('') + '</div>' +
          '<div class="wd-hint" id="wd-hint"></div>' +
        '</div>' +
        '<label class="f"><span>训练经验</span><select id="f-exp">' +
          '<option value="beginner"' + (p.experience === 'beginner' ? ' selected' : '') + '>新手（6 个月以内）</option>' +
          '<option value="intermediate"' + (p.experience === 'intermediate' ? ' selected' : '') + '>中级（6 个月 – 2 年）</option>' +
          '<option value="advanced"' + (p.experience === 'advanced' ? ' selected' : '') + '>进阶（2 年以上）</option>' +
        '</select></label>' +
        '<label class="f"><span>训练场地</span><select id="f-venue">' +
          '<option value="home_bodyweight"' + (p.venue === 'home_bodyweight' ? ' selected' : '') + '>居家徒手</option>' +
          '<option value="home_dumbbell"' + (p.venue === 'home_dumbbell' ? ' selected' : '') + '>居家哑铃</option>' +
          '<option value="gym"' + (p.venue === 'gym' ? ' selected' : '') + '>健身房</option>' +
        '</select></label>' +
        '<label class="f"><span>起始日期</span><input id="f-date" type="date" value="' + p.startDate + '"></label>' +
        '<button class="btn primary block" id="btnSave">保存并生成计划</button>' +
      '</div>' +

      '<h2 class="sec">身体评估</h2>' +
      '<div class="card">' +
        '<div class="kv"><span>BMI</span><b>' + b.toFixed(1) + ' · ' + E.bodyClassLabel(bc) + '</b></div>' +
        '<div class="kv"><span>健康体重区间</span><b>' + range.min + ' – ' + range.max + ' kg</b></div>' +
        '<div class="kv"><span>身高分档</span><b>' + E.heightClassLabel(hc) + '</b></div>' +
        '<div class="kv"><span>每周训练日</span><b>' + E.weekdaySummary(p.trainingWeekdays) + '（' + p.trainingWeekdays.length + ' 天）</b></div>' +
        '<div class="kv"><span>连续打卡</span><b>' + E.computeStreak(state.progress.logs, todayISO()) + ' 天</b></div>' +
        '<div class="kv"><span>累计完成训练</span><b>' + E.completedTrainingDays(state.progress) + ' 次</b></div>' +
        '<div class="cues" style="margin-top:10px">BMI 只用于判断动作冲击量与起始配重，计划同时依据你的目标、经验与场地调整。</div>' +
      '</div>' +

      '<h2 class="sec">数据</h2>' +
      '<div class="card">' +
        '<div class="cues" style="margin-bottom:11px">所有数据只保存在这台设备的浏览器里，不会上传到任何服务器。</div>' +
        '<button class="btn danger block" id="btnReset">' + (hasLogs ? '清除打卡记录' : '清除全部数据') + '</button>' +
      '</div>';

    /* 星期开关：只更新自身 DOM，避免重绘整个表单而清掉用户已填的身高体重 */
    var draftWd = p.trainingWeekdays.slice();
    var wdHintEl = document.getElementById('wd-hint');
    function paintWeekdays(msg) {
      var count = draftWd.length;
      document.getElementById('wd-count').textContent = count;
      Array.prototype.forEach.call(document.querySelectorAll('#wd-picker .wd-btn'), function (b) {
        b.setAttribute('aria-pressed', draftWd.indexOf(Number(b.dataset.wd)) >= 0 ? 'true' : 'false');
      });
      Array.prototype.forEach.call(document.querySelectorAll('#wd-presets .preset'), function (b) {
        var n = Number(b.dataset.preset);
        var hit = n === count && E.trainingWeekdays(n).join(',') === draftWd.join(',');
        b.setAttribute('aria-pressed', hit ? 'true' : 'false');
      });
      var warn = false;
      var text;
      if (msg) { text = msg; warn = true; }
      else if (count === 7) { text = '已选 7 天：没有完整休息日，第 7 天会自动安排为低强度恢复日。'; warn = true; }
      else { text = '已选：' + E.weekdaySummary(draftWd) + '，每周 ' + count + ' 天'; }
      wdHintEl.textContent = text;
      wdHintEl.classList.toggle('warn', warn);
    }
    document.getElementById('wd-picker').addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('.wd-btn') : null;
      if (!b) return;
      var v = Number(b.dataset.wd);
      var at = draftWd.indexOf(v);
      if (at >= 0) {
        if (draftWd.length === 1) { paintWeekdays('至少要保留 1 个训练日。'); return; }
        draftWd.splice(at, 1);
      } else {
        draftWd.push(v);
        draftWd.sort(function (a, c) { return a - c; });
      }
      paintWeekdays();
    });
    document.getElementById('wd-presets').addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('.preset') : null;
      if (!b) return;
      draftWd = E.trainingWeekdays(Number(b.dataset.preset));
      paintWeekdays();
    });
    paintWeekdays();

    document.getElementById('btnSave').onclick = function () {
      var next = {
        heightCm: Number(document.getElementById('f-h').value),
        weightKg: Number(document.getElementById('f-w').value),
        goal: document.getElementById('f-goal').value,
        trainingWeekdays: draftWd.slice(),
        experience: document.getElementById('f-exp').value,
        venue: document.getElementById('f-venue').value,
        startDate: document.getElementById('f-date').value || todayISO()
      };
      var errs = E.validateProfile(next);
      if (errs.length) { alert(errs.join('\n')); return; }
      var prev = state.profile;
      var prevWd = prev ? E.trainingWeekdays(prev).join(',') : '';
      var structChanged = !prev || prevWd !== next.trainingWeekdays.join(',') || prev.startDate !== next.startDate;
      if (structChanged && hasLogs) {
        if (!confirm('修改了每周训练日或起始日期，已有的打卡记录将不再对应新计划，是否重置打卡记录？\n（点击“取消”则保留记录，但计划日期会重新计算）')) {
          /* 保留记录 */
        } else {
          state.progress = { logs: {} };
          saveProgress();
        }
      }
      state.profile = E.normalizeProfile(next);
      saveProfile();
      state.tab = 'today';
      syncTabs();
      render();
    };
    document.getElementById('btnReset').onclick = function () {
      if (!confirm('确定清除本机保存的全部数据吗？此操作不可撤销。')) return;
      try { localStorage.removeItem(KEY_PROFILE); localStorage.removeItem(KEY_PROGRESS); } catch (e) {}
      state.profile = null; state.progress = { logs: {} };
      resetTimer();
      render();
    };
  }

  /* ---------------- 总渲染 ---------------- */
  function syncTabs() {
    Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function (b) {
      b.classList.toggle('active', b.dataset.tab === state.tab);
    });
    document.getElementById('view-today').hidden = state.tab !== 'today';
    document.getElementById('view-plan').hidden = state.tab !== 'plan';
    document.getElementById('view-me').hidden = state.tab !== 'me';
  }
  function render() {
    syncTabs();
    if (state.tab === 'today') renderToday();
    else if (state.tab === 'plan') renderPlan();
    else renderMe();
    if (state.profile) {
      var tb = document.getElementById('timerBar');
      if (!timerHandle && timerRemain === 0) tb.classList.add('hide');
    }
  }

  document.querySelectorAll('nav.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-rest],[data-goto]') : null;
    if (!t) return;
    if (t.dataset.rest) showTimer(Number(t.dataset.rest), '组间休息');
    if (t.dataset.goto) { state.tab = t.dataset.goto; render(); window.scrollTo(0, 0); }
  });
  document.getElementById('timerToggle').addEventListener('click', toggleTimer);
  document.getElementById('timerReset').addEventListener('click', resetTimer);

  loadState();
  if (!state.profile) state.tab = 'me';
  render();
})();
</script>
</body>
</html>
